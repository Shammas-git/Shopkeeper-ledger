{% extends "base.html" %}

{% block title %}All Accounts - Shopkeeper Ledger{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card mb-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-users me-2"></i>Manage Account</h5>

            </div>
            <div class="card-body">
                {% if user %}
                <div class="table-responsive-scroll">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Customers</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <span class="d-flex align-items-center">
                                        <i class="fas fa-user text-primary me-2"></i>
                                        {{ user.username }}
                                    </span>
                                </td>
                                <td>{{ user.email }}</td>
                                <td>{{ user.customers|length }}</td>
                                <td>
                                    <div class="d-flex gap-2">
                                      <a href="{{ url_for('routes.switch_user', user_id=user.id) }}" class="btn btn-primary"">
                                          <i class="fas fa-edit"></i>
                                      </a>
                                        <form method="POST" action="{{ url_for('routes.delete_account', user_id=user.id) }}" target="_top" 
                                              onsubmit="return confirm('Are you sure you want to delete this account? This will delete all customers and transactions associated with this account and cannot be undone.')">
                                            <button type="submit" class="btn btn-danger btn-sm">
                                                <i class="fas fa-trash-alt me-1"></i>
                                            </button>
                                        </form>
                                      <a href="{{ url_for('routes.logout') }}" class="btn btn-danger btn-sm">
                                          <i class="fas fa-sign-out-alt me-1"></i>
                                      </a>
                                      
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                {% else %}
                <div class="alert alert-info">
                    <i class="fas fa-info-circle me-2"></i>No accounts found.
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
